name: Salicru EQUINOX
version: "1.1.0"
slug: salicru_equinox
description: Monitorización de inversores Salicru EQUINOX mediante la plataforma EQUINOX
url: https://github.com/aeespigares/salicru-equinox-ha

startup: application
boot: auto
init: false

arch:
  - amd64
  - aarch64
  - armv7

services:
  - mqtt:need

options:
  email: null
  password: null
  plant_ids: []
  poll_interval: 900

schema:
  email: str
  password: password
  plant_ids:
    - str
  plant_id: str?
  poll_interval: int
